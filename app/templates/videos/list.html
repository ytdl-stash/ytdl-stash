{% extends "base.html" %}
{% block title %}Videos — ytdl-stash{% endblock %}
{% block content %}
<div class="flex items-center justify-between flex-wrap gap-2 mb-4">
  <h1 class="text-2xl font-bold m-0">Videos</h1>
  <span id="job-inline-retry_all_failed">
    <button class="btn btn-sm btn-secondary"
            hx-post="/jobs/retry_all_failed/trigger"
            hx-target="#job-inline-retry_all_failed"
            hx-swap="innerHTML"
            hx-confirm="Reset ALL failed videos to pending?">
      Retry All Failed
    </button>
  </span>
</div>
<form id="filter-form" method="get" action="/videos" class="mb-4">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
    <label class="form-control w-full max-w-xs">
      <span class="label-text">Channel</span>
      <select name="channel_id" class="select select-bordered w-full">
        <option value="">All</option>
        {% for c in channels %}
        <option value="{{ c.id }}" {% if selected_channel_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="form-control w-full max-w-xs">
      <span class="label-text">Status</span>
      <select name="status" class="select select-bordered w-full">
        <option value="">All</option>
        <option value="pending" {% if selected_status == 'pending' %}selected{% endif %}>Pending</option>
        <option value="downloading" {% if selected_status == 'downloading' %}selected{% endif %}>Downloading</option>
        <option value="cancelling" {% if selected_status == 'cancelling' %}selected{% endif %}>Cancelling</option>
        <option value="downloaded" {% if selected_status == 'downloaded' %}selected{% endif %}>Downloaded</option>
        <option value="importing" {% if selected_status == 'importing' %}selected{% endif %}>Importing</option>
        <option value="imported" {% if selected_status == 'imported' %}selected{% endif %}>Imported</option>
        <option value="synced" {% if selected_status == 'synced' %}selected{% endif %}>Synced</option>
        <option value="failed" {% if selected_status == 'failed' %}selected{% endif %}>Failed</option>
        <option value="cancelled" {% if selected_status == 'cancelled' %}selected{% endif %}>Cancelled</option>
      </select>
    </label>
    <button type="submit" class="btn btn-primary">Filter</button>
  </div>
</form>
<div hx-get="/videos"
     hx-trigger="every 10s"
     hx-target="#video-table-body"
     hx-swap="innerHTML"
     hx-include="#filter-form">
  <table class="table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Channel</th>
        <th>Status</th>
        <th>Upload Date</th>
        <th>Duration</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="video-table-body">
      {% include "videos/_table_body.html" %}
    </tbody>
  </table>
</div>
{% endblock %}
