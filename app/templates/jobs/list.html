{% extends "base.html" %}
{% block title %}Jobs — ytdl-stash{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-2">Jobs</h1>
<p class="mb-4">Background jobs run on a schedule. Use <strong>Run Now</strong> to trigger one immediately.</p>

<div class="overflow-x-auto">
  <table class="table table-responsive">
    <thead>
      <tr>
        <th class="tooltip tooltip-bottom" data-tip="Background task name and description">Job</th>
        <th class="tooltip tooltip-bottom" data-tip="Current state — Running, Idle, or Error">Status</th>
        <th class="tooltip tooltip-bottom" data-tip="When this job last executed and how long it took">Last Run</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="job-list"
           hx-get="/jobs/status"
           hx-trigger="every 3s"
           hx-swap="innerHTML">
      {% include "jobs/_job_rows.html" %}
    </tbody>
  </table>
</div>
{% endblock %}
