{% if job.running %}
{# Self-poll every 2s until the job finishes, then restore the button #}
<span hx-get="/jobs/{{ job.id }}/inline-status"
      hx-trigger="every 2s"
      hx-target="#job-inline-{{ job.id }}"
      hx-swap="innerHTML"
      class="badge badge-primary inline-flex items-center gap-1">
  <span class="loading loading-spinner loading-sm"></span>
  Running…
</span>
<button type="button" class="btn btn-sm btn-secondary"
        hx-post="/jobs/{{ job.id }}/stop"
        hx-target="#job-inline-{{ job.id }}"
        hx-swap="innerHTML"
        hx-confirm="Stop '{{ job.name|e }}'?">
  Stop
</button>
{% else %}
{# Job is idle — show the appropriate trigger button #}
{% if job.id == 'retry_all_failed' %}
<button type="button" class="btn btn-sm btn-secondary"
        hx-post="/jobs/{{ job.id }}/trigger"
        hx-target="#job-inline-{{ job.id }}"
        hx-swap="innerHTML"
        hx-confirm="Retry ALL failed videos? (Import-only when file exists; full re-download otherwise)">
  Retry All Failed
</button>
{% elif job.id == 'check_all_channels' %}
<button type="button" class="btn btn-sm btn-primary"
        hx-post="/jobs/{{ job.id }}/trigger"
        hx-target="#job-inline-{{ job.id }}"
        hx-swap="innerHTML">
  Check All Now
</button>
{% else %}
<button type="button" class="btn btn-sm btn-primary"
        hx-post="/jobs/{{ job.id }}/trigger"
        hx-target="#job-inline-{{ job.id }}"
        hx-swap="innerHTML">
  Run Now
</button>
{% endif %}
{% endif %}
