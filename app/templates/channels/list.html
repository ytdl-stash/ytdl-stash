{% extends "base.html" %}
{% block title %}Channels — ytdl-stash{% endblock %}
{% block content %}
<div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;">
  <h1 style="margin-bottom: 0;">Channels</h1>
  <span id="job-inline-check_all_channels">
    <button class="job-btn"
            hx-post="/jobs/check_all_channels/trigger"
            hx-target="#job-inline-check_all_channels"
            hx-swap="innerHTML">
      Check All Now
    </button>
  </span>
</div>
<form hx-post="/channels"
      hx-target="#channel-list"
      hx-swap="beforeend"
      hx-on::after-request="this.reset()">
  <div class="grid">
    <label>URL <input type="url" name="url" placeholder="Channel URL" required></label>
    <label>Name <input type="text" name="name" placeholder="Display name"></label>
    <label>Interval (hours) <input type="number" name="check_interval_hours" value="6" min="1"></label>
    <label>Max Age (days) <input type="number" name="max_video_age_days" placeholder="No limit" min="1"></label>
    <label>Min Duration (sec) <input type="number" name="min_duration_seconds" placeholder="No limit" min="1"></label>
  </div>
  <button type="submit">Add Channel</button>
</form>
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Site</th>
      <th>Videos</th>
      <th>Interval</th>
      <th>Max Age</th>
      <th>Min Duration</th>
      <th>Last Checked</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="channel-list">
    {% for channel in channels %}
    {% include "channels/_row.html" %}
    {% endfor %}
  </tbody>
</table>
{% endblock %}
