{% extends "base.html" %}
{% block title %}Channels — ytdl-stash{% endblock %}
{% block content %}
<div class="flex items-center justify-between flex-wrap gap-2 mb-4">
  <h1 class="text-2xl font-bold m-0">Channels</h1>
  <span id="job-inline-check_all_channels">
    <button class="btn btn-sm btn-primary"
            hx-post="/jobs/check_all_channels/trigger"
            hx-target="#job-inline-check_all_channels"
            hx-swap="innerHTML">
      Check All Now
    </button>
  </span>
</div>
<form class="mb-6" hx-post="/channels"
      hx-target="#channel-list"
      hx-swap="beforeend"
      hx-on::after-request="this.reset()">
  <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
    <label class="form-control w-full">
      <span class="label-text">URL</span>
      <input type="url" name="url" placeholder="Channel URL" required class="input input-bordered w-full">
    </label>
    <label class="form-control w-full">
      <span class="label-text">Name</span>
      <input type="text" name="name" placeholder="Display name" class="input input-bordered w-full">
    </label>
    <label class="form-control w-full">
      <span class="label-text">Interval (hours)</span>
      <input type="number" name="check_interval_hours" value="6" min="1" class="input input-bordered w-full">
    </label>
    <label class="form-control w-full">
      <span class="label-text">Max Age (days)</span>
      <input type="number" name="max_video_age_days" placeholder="No limit" min="1" class="input input-bordered w-full">
    </label>
    <label class="form-control w-full">
      <span class="label-text">Min Duration (sec)</span>
      <input type="number" name="min_duration_seconds" placeholder="No limit" min="1" class="input input-bordered w-full">
    </label>
  </div>
  <button type="submit" class="btn btn-primary mt-2">Add Channel</button>
</form>
<table class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Site</th>
      <th>Videos</th>
      <th>Interval</th>
      <th>Max Age</th>
      <th>Min Duration</th>
      <th>Last Checked</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="channel-list">
    {% for channel in channels %}
    {% include "channels/_row.html" %}
    {% endfor %}
  </tbody>
</table>
{% endblock %}
