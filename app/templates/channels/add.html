{% extends "base.html" %}
{% block title %}Add Channel — ytdl-stash{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-2">Add Channel</h1>
<p class="mb-4"><a href="/channels" class="link link-hover">← Back to Channels</a></p>
<form method="post" action="/channels" class="space-y-4 max-w-xl">
  <label class="form-control w-full">
    <span class="label-text">URL</span>
    <input type="url" name="url" placeholder="Channel URL" required class="input input-bordered w-full">
  </label>
  <label class="form-control w-full">
    <span class="label-text">Name</span>
    <input type="text" name="name" placeholder="Display name" class="input input-bordered w-full">
  </label>
  <label class="form-control w-full">
    <span class="label-text">Interval (hours)</span>
    <input type="number" name="check_interval_hours" value="6" min="1" class="input input-bordered w-full">
  </label>
  <label class="form-control w-full">
    <span class="label-text">Max Video Age (days)</span>
    <input type="number" name="max_video_age_days" placeholder="No limit (download all)" min="1" class="input input-bordered w-full">
    <span class="label-text-alt text-base-content/60 mt-1">Only download videos uploaded within this many days. Leave blank for no limit.</span>
  </label>
  <label class="form-control w-full">
    <span class="label-text">Min Duration (seconds)</span>
    <input type="number" name="min_duration_seconds" placeholder="No limit (download all)" min="1" class="input input-bordered w-full">
    <span class="label-text-alt text-base-content/60 mt-1">Only download videos longer than this many seconds. Leave blank for no limit.</span>
  </label>
  <button type="submit" class="btn btn-primary">Add Channel</button>
</form>
{% endblock %}
