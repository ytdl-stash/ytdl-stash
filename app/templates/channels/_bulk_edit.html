<form hx-put="/channels/bulk"
      hx-target="#channel-table-wrap"
      hx-swap="innerHTML"
      class="space-y-4">
  <div class="flex gap-2">
    <button type="submit" class="btn btn-sm btn-primary">Save All</button>
    <button type="button"
            class="btn btn-sm btn-ghost"
            hx-get="/channels/table"
            hx-target="#channel-table-wrap"
            hx-swap="innerHTML">
      Cancel
    </button>
  </div>
  <div class="overflow-x-auto">
    <table class="table table-responsive">
      <thead>
        <tr>
          <th>Name</th>
          <th>Site</th>
          <th>Videos</th>
          <th>Interval</th>
          <th>Max Age</th>
          <th>Min Duration</th>
          <th>Last Checked</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for channel in channels %}
        <tr id="channel-row-{{ channel.id }}" class="{{ 'opacity-65 grayscale hover:opacity-90' if not channel.enabled else '' }}">
          <td data-label="Name">
            <input type="text"
                   name="name__{{ channel.id }}"
                   value="{{ channel.name|e }}"
                   placeholder="Channel name"
                   aria-label="Channel name"
                   class="input input-bordered input-sm min-w-64">
          </td>
          <td data-label="Site">{{ channel.site }}</td>
          <td data-label="Videos">{{ channel.videos|length }}</td>
          <td data-label="Interval">
            <input type="number"
                   name="check_interval_hours__{{ channel.id }}"
                   value="{{ channel.check_interval_hours }}"
                   min="1"
                   aria-label="Interval (hours)"
                   class="input input-bordered input-sm w-24">
          </td>
          <td data-label="Max Age">
            <input type="number"
                   name="max_video_age_days__{{ channel.id }}"
                   value="{{ channel.max_video_age_days if channel.max_video_age_days else '' }}"
                   min="1"
                   placeholder="—"
                   aria-label="Max age (days)"
                   class="input input-bordered input-sm w-28">
          </td>
          <td data-label="Min Duration">
            <input type="number"
                   name="min_duration_seconds__{{ channel.id }}"
                   value="{{ channel.min_duration_seconds if channel.min_duration_seconds else '' }}"
                   min="1"
                   placeholder="—"
                   aria-label="Min duration (seconds)"
                   class="input input-bordered input-sm w-28">
          </td>
          <td data-label="Last Checked">{{ channel.last_checked_at.strftime('%Y-%m-%d %H:%M') if channel.last_checked_at else 'Never' }}</td>
          <td data-label="Status">
            <label class="inline-flex items-center gap-1">
              <input type="hidden" name="enabled__{{ channel.id }}" value="false">
              <input type="checkbox"
                     name="enabled__{{ channel.id }}"
                     value="true"
                     {% if channel.enabled %}checked{% endif %}
                     aria-label="Enabled"
                     class="checkbox checkbox-sm">
              <span class="text-sm">Enabled</span>
            </label>
          </td>
          <td data-label="Actions">
            <button type="button"
                    class="btn btn-sm btn-primary"
                    hx-post="/channels/{{ channel.id }}/check-now"
                    hx-target="#check-result-{{ channel.id }}"
                    hx-swap="innerHTML"
                    hx-indicator="#spinner-{{ channel.id }}">
              Check Now
            </button>
            <span id="spinner-{{ channel.id }}" class="htmx-indicator">Scanning…</span>
            <span id="check-result-{{ channel.id }}"></span>
            <button type="button"
                    class="btn btn-sm btn-error"
                    hx-delete="/channels/{{ channel.id }}"
                    hx-target="#channel-row-{{ channel.id }}"
                    hx-swap="outerHTML swap:1s"
                    hx-confirm="Delete channel '{{ channel.name|e }}' and all its videos?">
              Delete
            </button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</form>
