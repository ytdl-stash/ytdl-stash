{% if records %}
<div class="text-xs text-base-content/60 mb-2">Showing {{ records|length }} entries (newest first)</div>
<div class="cr-log">
  {% for record in records %}
  <div class="cr-logrow cr-lvl-{{ record.level|lower }}" data-label="">
    <span class="ts">{{ record.timestamp }}</span>
    <span class="lvl">{{ record.level }}</span>
    <span class="lg" title="{{ record.logger }}">{{ record.logger }}</span>
    <span class="msg">{{ record.message }}</span>
  </div>
  {% endfor %}
</div>
{% else %}
<p>No log entries.</p>
{% endif %}
