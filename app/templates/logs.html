{% extends "base.html" %}
{% block title %}Logs — ytdl-stash{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Logs</h1>

<div class="mb-4">
  <form id="log-filter-form" class="flex flex-wrap gap-2 items-center mb-2"
        hx-get="/logs/entries"
        hx-target="#log-entries"
        hx-swap="innerHTML"
        hx-trigger="change from:find select, keyup changed delay:500ms from:find input, search from:find input">
    <select name="level" id="log-level-filter" aria-label="Minimum level" class="select select-bordered select-sm max-w-56 tooltip tooltip-bottom" data-tip="Show only log entries at or above this severity">
      <option value="" {% if not current_level %}selected{% endif %}>All levels</option>
      <option value="DEBUG" {% if current_level == "DEBUG" %}selected{% endif %}>DEBUG</option>
      <option value="INFO" {% if current_level == "INFO" %}selected{% endif %}>INFO</option>
      <option value="WARNING" {% if current_level == "WARNING" %}selected{% endif %}>WARNING</option>
      <option value="ERROR" {% if current_level == "ERROR" %}selected{% endif %}>ERROR</option>
    </select>
    <input type="search" name="search" placeholder="Search logs…"
           value="{{ current_search }}" aria-label="Search logs"
           class="input input-bordered input-sm max-w-56 tooltip tooltip-bottom" data-tip="Filter logs by keyword">
    <select name="limit" aria-label="Entries to show" class="select select-bordered select-sm max-w-56 tooltip tooltip-bottom" data-tip="Maximum number of log entries to display">
      <option value="50" {% if current_limit == 50 %}selected{% endif %}>50 entries</option>
      <option value="200" {% if current_limit == 200 %}selected{% endif %}>200 entries</option>
      <option value="500" {% if current_limit == 500 %}selected{% endif %}>500 entries</option>
      <option value="1000" {% if current_limit == 1000 %}selected{% endif %}>1000 entries</option>
    </select>
  </form>
  <div class="flex flex-wrap gap-2 items-center">
    <button type="button" class="btn btn-sm btn-ghost tooltip tooltip-bottom" data-tip="Clear the in-memory log buffer (does not delete log file)"
            hx-post="/logs/clear"
            hx-target="#log-entries"
            hx-swap="innerHTML"
            hx-confirm="Clear in-memory log buffer?">
      Clear
    </button>
    <a href="/logs/download" class="btn btn-sm btn-ghost inline-flex items-center tooltip tooltip-bottom" data-tip="Download the persistent log file from disk">Download log file</a>
    <label class="flex items-center gap-1 text-sm cursor-pointer tooltip tooltip-bottom" data-tip="Automatically reload logs every 5 seconds">
      <input type="checkbox" id="auto-refresh-toggle" class="toggle toggle-sm" checked>
      Auto-refresh
    </label>
  </div>
</div>

<div id="log-entries"
     hx-get="/logs/entries"
     hx-include="#log-filter-form"
     hx-trigger="every 5s [document.getElementById('auto-refresh-toggle')?.checked === true]"
     hx-swap="innerHTML">
  {% include "logs/_entries.html" %}
</div>

<script>
// Preserve scroll position during auto-refresh unless user scrolled to top
document.body.addEventListener('htmx:beforeSwap', function(evt) {
  if (evt.detail.target && evt.detail.target.id === 'log-entries') {
    evt.detail.target.dataset.scrollTop = evt.detail.target.scrollTop;
  }
});
document.body.addEventListener('htmx:afterSwap', function(evt) {
  if (evt.detail.target && evt.detail.target.id === 'log-entries') {
    var prev = parseInt(evt.detail.target.dataset.scrollTop || '0', 10);
    if (prev > 0) {
      evt.detail.target.scrollTop = prev;
    }
  }
});
</script>
{% endblock %}
