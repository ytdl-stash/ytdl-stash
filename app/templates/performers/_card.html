<article id="performer-card-{{ channel.id }}" class="performer-card">
  <a href="/performers/{{ channel.id }}" class="performer-card-link">
    {% if channel.performer_image_url %}
    <img src="{{ channel.performer_image_url }}" alt="" class="performer-card-img" loading="lazy">
    {% else %}
    <div class="performer-card-placeholder"></div>
    {% endif %}
    <h3 class="performer-card-name">{{ channel.name }}</h3>
    <span class="performer-site-badge">{{ channel.site }}</span>
    <span class="performer-video-count">{{ channel.videos|length }} video{{ channel.videos|length != 1 and 's' or '' }}</span>
    <span class="{% if channel.enabled %}watched-indicator{% else %}not-watched-indicator{% endif %}" title="{% if channel.enabled %}Watching{% else %}Not watching{% endif %}"></span>
    <span class="{% if channel.stash_performer_id %}stash-linked{% else %}stash-unlinked{% endif %}" title="{% if channel.stash_performer_id %}Linked to Stash{% else %}Not in Stash{% endif %}"></span>
  </a>
  <div class="performer-card-actions">
    <form hx-post="/performers/{{ channel.id }}/toggle"
          hx-target="#performer-card-{{ channel.id }}"
          hx-swap="outerHTML"
          style="display: inline;">
      <button type="submit" class="{% if not channel.enabled %}secondary{% endif %}">{{ 'Unwatch' if channel.enabled else 'Watch' }}</button>
    </form>
    <form hx-post="/performers/{{ channel.id }}/sync"
          hx-target="#performer-card-{{ channel.id }}"
          hx-swap="outerHTML"
          hx-indicator="#spinner-sync-{{ channel.id }}"
          style="display: inline;">
      <button type="submit">Sync to Stash</button>
      <span id="spinner-sync-{{ channel.id }}" class="htmx-indicator">Syncing…</span>
    </form>
    <button hx-delete="/performers/{{ channel.id }}"
            hx-target="#performer-card-{{ channel.id }}"
            hx-swap="outerHTML swap:1s"
            hx-confirm="Delete performer '{{ channel.name|e }}' and all its videos?"
            class="secondary">
      Delete
    </button>
  </div>
</article>
