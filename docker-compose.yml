services:
  ytdl-stash:
    # Use the pre-built image from GitHub Container Registry:
    # image: ghcr.io/<OWNER>/ytdl-stash:latest
    # Or build from source:
    build: .
    ports:
      - "8282:8000"
    volumes:
      - ./data:/app/data
      - ${DOWNLOAD_PATH:-./downloads}:/downloads
      # Optional: mount cookies file (also uncomment YTDL_COOKIES_FILE below)
      # - ./cookies.txt:/app/cookies.txt:ro
    environment:
      YTDL_STASH_URL: ${STASH_URL:-http://host.docker.internal:9999}
      YTDL_STASH_API_KEY: ${STASH_API_KEY:-}
      YTDL_DOWNLOAD_DIR: /downloads
      # YTDL_STASH_DOWNLOAD_DIR: /data/downloads  # Path to downloads as Stash sees it
      # A Stash renamer plugin moves/renames files on import: wait for the move
      # to land and verify generate, so a busy Stash job queue can't leave
      # scenes without covers/sprites/previews. (Quoted so YAML keeps the string.)
      YTDL_STASH_EXPECT_RENAMER_ON_IMPORT: "true"
      # YTDL_STASH_IMPORT_SETTLE_TIMEOUT_SECONDS: 600  # max wait (s) for the move
      YTDL_DATA_DIR: /app/data
      # YTDL_COOKIES_FILE: /app/cookies.txt
      # YTDL_DEFAULT_CHECK_INTERVAL_HOURS: 6
      # YTDL_MAX_CONCURRENT_DOWNLOADS: 1
      # YTDL_DOWNLOAD_DELAY_SECONDS: 5
      # YTDL_YTDLP_OUTPUT_TEMPLATE: "%(uploader)s - %(title)s [%(id)s].%(ext)s"
      # yt-dlp options (optional)
      # YTDL_YTDLP_FORMAT: "bestvideo+bestaudio/best"
      # YTDL_YTDLP_IMPERSONATE: "chrome"
      # YTDL_YTDLP_USER_AGENT: "Mozilla/5.0 ..."
      # YTDL_YTDLP_REFERER: "https://www.pornhub.com/"
      # YTDL_YTDLP_PROXY: "socks5://127.0.0.1:9050"
      # YTDL_YTDLP_SOCKET_TIMEOUT_SECONDS: 30
      # YTDL_YTDLP_RETRIES: 3
      # YTDL_YTDLP_FRAGMENT_RETRIES: 3
      # YTDL_YTDLP_HTTP_HEADERS_JSON: "{}"
      # YTDL_YTDLP_SCAN_OPTS_JSON: "{}"
      # YTDL_YTDLP_DOWNLOAD_OPTS_JSON: "{}"
      # YTDL_YTDLP_UPDATE_CHECK_INTERVAL_HOURS: 24
      # YTDL_LOG_LEVEL: INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
